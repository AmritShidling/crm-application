spring:
  application:
    name: crm-sale-service
  datasource:
    url: jdbc:mysql://localhost:3306/sales_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    ip-address: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}:localhost:${server.port} # Force the instance ID
