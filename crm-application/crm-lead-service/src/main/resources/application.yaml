server:
  port: 8082

spring:
  application:
    name: CRM-LEAD-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/lead_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
